<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरा सर्च इंजन</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; margin: 0; background: #f8f9fa; }
        h1 { font-size: 3rem; color: #4285f4; margin-bottom: 25px; }
        form { display: flex; gap: 10px; width: 90%; max-width: 550px; }
        input[type="text"] { flex: 1; padding: 14px 20px; font-size: 16px; border: 1px solid #dfe1e5; border-radius: 25px; outline: none; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        input[type="text"]:focus { border-color: #4285f4; box-shadow: 0 2px 8px rgba(66,133,244,0.3); }
        button { padding: 12px 24px; font-size: 15px; border: none; border-radius: 25px; background-color: #4285f4; color: white; cursor: pointer; font-weight: 600; }
        button:hover { background-color: #3367d6; }
        .results { margin-top: 35px; width: 90%; max-width: 550px; }
        .results ul { list-style: none; padding: 0; }
        .results li { margin: 12px 0; background: white; padding: 12px 16px; border-radius: 8px; border: 1px solid #e0e0e0; }
        .results a { color: #1a0dab; text-decoration: none; font-size: 18px; word-break: break-all; }
        .results a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>सर्च इंजन</h1>
    <form action="/search" method="get">
        <input type="text" name="q" placeholder="यहाँ python, github, या google लिखें..." required>
        <button type="submit">खोजें</button>
    </form>

    {% if results %}
    <div class="results">
        <ul>
            {% for link in results %}
                <li><a href="{{ link }}" target="_blank">{{ link }}</a></li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}
</body>
</html>
