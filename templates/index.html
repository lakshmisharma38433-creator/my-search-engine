
<!DOCTYPE html>
<html>
<head>
    <title>My Search Engine</title>
</head>
<body>
    <h1>My Search Engine</h1>

    <form method="get">
        <input type="text" name="q" placeholder="Search">
        <button type="submit">Search</button>
    </form>

    {% for result in results %}
        <p>{{ result }}</p>
    {% endfor %}
</body>
</html>
